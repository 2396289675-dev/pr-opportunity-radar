<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>传播机会雷达 · 每日判读</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --line:#e8e5df; --line2:#d5d2c9;
    --tx:#2b2b28; --tx2:#5c5b56; --tx3:#8b8a83;
    --p0-bg:#fcebeb; --p0-fg:#a32d2d; --p0-bd:#f09595;
    --p1-bg:#faeeda; --p1-fg:#854f0b; --p1-bd:#ef9f27;
    --p2-bg:#f1efe8; --p2-fg:#5f5e5a; --p2-bd:#b4b2a9;
    --risk-bg:#fcf3ed; --risk-fg:#993c1d;
    --ok-bg:#eaf3de; --ok-fg:#3b6d11;
    --brand:#185fa5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
    font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 24px 56px}

  /* ---------- 头部 ---------- */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:24px 26px;margin-bottom:18px}
  .hero h1{font-size:21px;font-weight:600;margin:0 0 6px;letter-spacing:.3px}
  .hero .desc{color:var(--tx2);font-size:13.5px;margin-bottom:16px;line-height:1.7}
  .hero .date{color:var(--tx3);font-size:12.5px}

  /* ---------- 漏斗 ---------- */
  .funnel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 26px;margin-bottom:26px}
  .funnel .fh{font-size:13px;color:var(--tx3);margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
  .funnel .fh b{font-size:14px;color:var(--tx);font-weight:600}
  .frow{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .frow .lab{flex:none;width:96px;font-size:12.5px;color:var(--tx2);text-align:right}
  .frow .track{flex:1;height:26px;background:#f2f0ea;border-radius:6px;overflow:hidden}
  .frow .fill{height:100%;border-radius:6px;display:flex;align-items:center;
    padding-left:10px;color:#fff;font-size:12.5px;font-weight:600;
    min-width:52px;white-space:nowrap;
    transition:width .8s cubic-bezier(.22,1,.36,1)}
  .frow .num{flex:none;width:52px;font-size:12.5px;color:var(--tx3);text-align:right}
  .fnote{margin-top:12px;font-size:12.5px;color:var(--tx3);line-height:1.7;
    padding-top:12px;border-top:1px dashed var(--line2)}

  /* ---------- 区块标题 ---------- */
  .sec-h{display:flex;align-items:center;gap:9px;margin:28px 0 13px;flex-wrap:wrap}
  .sec-h .t{font-size:15.5px;font-weight:600}
  .sec-h .c{font-size:12px;color:var(--tx3)}
  .sec-h .bar{width:3px;height:16px;border-radius:2px;background:var(--line2);
    display:inline-block}

  /* ---------- 人物卡 ---------- */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
    border-left:3px solid #afa9ec;padding:16px 18px}
  .pcard .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .avatar{flex:none;width:34px;height:34px;border-radius:9px;background:#eeedfe;
    color:#534ab7;font-size:15px;font-weight:600;display:flex;
    align-items:center;justify-content:center}
  .pcard .nm{font-size:15px;font-weight:600;line-height:1.35}
  .pcard .tp{font-size:11.5px;color:#534ab7;background:#eeedfe;border:1px solid #afa9ec;
    border-radius:5px;padding:1px 7px;display:inline-block;margin-top:3px}
  .pcard .ht{margin-left:auto;font-size:12px;color:var(--tx3);flex:none;text-align:right}
  .pcard .ht b{display:block;font-size:14px;color:#993c1d;font-weight:600}
  .pcard .ps{font-size:13px;color:var(--tx2);line-height:1.65;margin-bottom:9px}

  /* ---------- 机会卡 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:12px}
  .card.p0{border-left:3px solid var(--p0-bd)}
  .card.p1{border-left:3px solid var(--p1-bd)}
  .card.p2{border-left:3px solid var(--p2-bd)}
  .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
  .badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;
    white-space:nowrap;flex:none;margin-top:2px}
  .badge.P0{background:var(--p0-bg);color:var(--p0-fg);border:1px solid var(--p0-bd)}
  .badge.P1{background:var(--p1-bg);color:var(--p1-fg);border:1px solid var(--p1-bd)}
  .badge.P2{background:var(--p2-bg);color:var(--p2-fg);border:1px solid var(--p2-bd)}
  .ttl{font-size:15px;font-weight:600;line-height:1.5}
  .ttl a{color:var(--tx);text-decoration:none;border-bottom:1px solid var(--line2)}
  .ttl a:hover{color:var(--brand);border-bottom-color:var(--brand)}
  .score{margin-left:auto;font-size:12px;color:var(--tx3);flex:none;padding-top:3px}
  .meta{font-size:12px;color:var(--tx3);margin-bottom:11px;display:flex;
    gap:7px;flex-wrap:wrap;align-items:center}
  .tag{background:#f1efe8;border-radius:5px;padding:1px 7px;color:var(--tx2)}
  .tag.gov{background:var(--ok-bg);color:var(--ok-fg)}
  .tag.hot{background:#faece7;color:#993c1d}
  .row{display:flex;gap:9px;margin-bottom:7px;font-size:13.5px;line-height:1.65}
  .row .k{flex:none;width:74px;color:var(--tx3);font-size:12.5px;padding-top:1px}
  .row .v{flex:1;color:var(--tx)}
  .row.ev .v{color:var(--tx2)}
  .row.risk .v{color:var(--risk-fg)}
  .row.risk .k{color:var(--risk-fg)}
  .row.biz .k,.row.biz .v{color:var(--brand)}
  .row.act .v{color:var(--brand)}
  .src{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
    margin:0 0 10px;font-size:12.5px}
  .src .m{background:var(--ok-bg);color:var(--ok-fg);border-radius:5px;
    padding:1px 8px;font-weight:600}
  .src a{color:var(--brand);text-decoration:none;white-space:nowrap}
  .src a:hover{text-decoration:underline}
  .src .more{color:var(--tx3)}
  .empty{background:var(--card);border:1px dashed var(--line2);border-radius:12px;
    padding:16px 18px;color:var(--tx2);font-size:13.5px;margin-bottom:12px}

  /* ---------- P2 紧凑列表 ---------- */
  .mini{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:6px 18px;margin-bottom:12px}
  .mrow{display:flex;gap:10px;align-items:baseline;padding:9px 0;
    border-bottom:1px solid #f2f0ea;font-size:13.5px}
  .mrow:last-child{border-bottom:0}
  .mrow .mt{flex:1;line-height:1.55}
  .mrow .mt a{color:var(--tx);text-decoration:none}
  .mrow .mt a:hover{color:var(--brand)}
  .mrow .mm{flex:none;font-size:12px;color:var(--tx3)}
  .mrow .mb{flex:none;font-size:11.5px;color:var(--brand);max-width:180px;
    text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12px;color:var(--tx3);line-height:1.85}

  /* ---------- 窄屏适配（嵌入 iframe / 手机） ---------- */
  @media (max-width:640px){
    .wrap{padding:18px 14px 40px}
    .hero{padding:18px 18px}
    .hero h1{font-size:18px}
    .funnel{padding:16px 16px}
    .frow .lab{width:70px;font-size:12px}
    .frow .num{width:44px}
    .pgrid{grid-template-columns:1fr}
    .row{flex-direction:column;gap:2px}
    .row .k{width:auto}
    .mrow{flex-direction:column;gap:3px}
    .mrow .mb{max-width:none;text-align:left}
  }
</style>
</head>

成，且有具体数字（130 多人）支撑。", "tencent_angle": "腾讯做记录者与传播平台，把“善意能落地”这件事讲出来。角色是让故事被看见，不抢叙事。", "risk": "需先核实是否已有商业介入或摆拍质疑，若有则放弃。", "action": "优先核真实性（有无媒体跟进、当事人是否可被找到），确认后今天内定产出形式。", "window": "热度在峰值，24-48 小时", "summary": "武汉黄陂一小伙结婚，在网上发帖邀请网友来吃席，起初更像一句玩笑。结果真有 130 多位陌生网友跨省赶赴，婚宴办成了一场陌生人的聚会。10 月 8 日冲上百度热搜，热度 637 万，是当天热榜上情绪最干净的一条——善意发出去，被陌生人接住了。", "biz": "微信 / 视频号 · 陌生人善意是最容易被转发的内容形态，可做视频号与微信状态的传播载体；也可接腾讯公益，讲“善意能落地”。"}, {"id": "76d5011aa391", "title": "引导学生巧用AI，把“听讲”变成“探究”", "urls": ["http://scitech.people.com.cn/n1/2026/1006/c1007-40809872.html"], "sources": ["人民网科技"], "source_count": 1, "on_hotlist": false, "official": true, "official_tier": "央媒", "heat": 0, "best_rank": null, "topic_tags": ["ai_public_good"], "person_hits": ["身份:学生"], "is_person": true, "media": "人民网科技", "url": "http://scitech.people.com.cn/n1/2026/1006/c1007-40809872.html", "reports": [{"media": "人民网科技", "title": "引导学生巧用AI，把“听讲”变成“探究”", "url": "http://scitech.people.com.cn/n1/2026/1006/c1007-40809872.html"}], "summary_raw": "近年来，AI与思政课结合的各种尝试不少，公开展示课上，教师通过AI与学生互动的环节愈发常见。思政课最怕两种状况：一是互不干扰，老师讲得口干舌燥，学生低头刷手机；二是假热闹，搞一堆花里胡哨的形式，但一堂课下来学生什么也没记住。说实话，刚开始把AI带进课堂时，我心里也打鼓：AI会不会变成另一种新的“花架子”？会不会让学生不动脑，直接抄答案？带着这些顾虑，我在特色班的课堂上做了几次尝试，效果出乎意料。 ", "priority": "P1", "score": 72, "topic": "AI普惠 · 教育", "opportunity": "央媒主动设置的 AI 向善议题——讨论“学生如何巧用 AI”，而不是 AI 风险叙事，这类正面框架很少见，是安全的发声窗口。", "tencent_angle": "工具提供方角色：面向师生的 AI 工具与 AI 素养内容。讲“给老师和学生提供用得上的能力”，不讲腾讯自己多先进。", "risk": "涉及未成年人，教育议题敏感度高，措辞必须稳妥；严禁出现“替学生写作业”类表述。", "action": "先读原文确认是哪所学校/地区的实践，评估是否有真实合作抓手；若无具体项目，先归入 AI 素养议题池。", "window": "议题型非事件型，10-06 发布，窗口期约 1-2 周", "summary": "人民网科技 10 月 6 日刊发一位思政课教师的自述。他说思政课最怕两种状况：老师讲得口干舌燥、学生低头刷手机；以及搞一堆花里胡哨的形式，一节课下来什么也没记住。他试着把 AI 带进课堂，让学生在对话里自己查证、追问，把“听讲”变成“探究”，也坦白刚开始担心 AI 只是变成新的花架子。这是央媒少见的 AI 向善正面框架，谈的不是风险。", "biz": "腾讯学堂 / 腾讯教育 · 面向师生的 AI 工具与 AI 素养内容，角色是给老师和学生提供用得上的能力，不谈自己多先进。"}, {"id": "01d90bf88923", "title": "拧紧智能体支付应用“安全阀”", "urls": ["http://finance.people.com.cn/n1/2026/1003/c1004-40809040.html"], "sources": ["人民网科技"], "source_count": 1, "on_hotlist
